<style type="text/css">.yg-banner-by-link-container {

    z-index: 999999;

    height: 46px;

    border-radius: 50%;
    background: rgba(255,255,255,0.9);

<script>
$(document).ready(function () {

    var ygSlider = $(".yg-banner-by-link-container ul");

    ygSlider.owlCarousel({
        items: 1,
        loop: true,
        autoplay: true,
        autoplayTimeout: 10000,
        autoplayHoverPause: true,
        nav: false,
        dots: true,
        margin: 0
    });

    $(".yg-custom-next").click(function () {
        ygSlider.trigger("next.owl.carousel");
    });

    $(".yg-custom-prev").click(function () {
        ygSlider.trigger("prev.owl.carousel");
    });

});

// Kampanya bitiş sayacı - kampanya değiştiğinde SADECE bu satırı güncelleyin (YYYY-AA-GGTSS:DD:SS)
var cabaniCountdownHedefTarih = "2026-10-05T23:59:59";

(function () {
    var kutular = document.querySelectorAll(".yg-banner-countdown");
    if (!kutular.length) return;

    var hedef = new Date(cabaniCountdownHedefTarih).getTime();
    var zamanlayici;

    function guncelle() {
        var fark = hedef - new Date().getTime();

        // owlCarousel sonsuz döngü için bu slaytı başa/sona kopyalar
        // (aynı .yg-banner-countdown birden fazla kez DOM'da olabilir),
        // bu yüzden hepsi tek tek güncellenir.
        kutular.forEach(function (kutu) {
            if (fark <= 0) {
                kutu.classList.add("yg-countdown-ended");
                kutu.querySelector(".yg-countdown-label").textContent = "KAMPANYA SONA ERDİ";
                return;
            }

            var gun = Math.floor(fark / (1000 * 60 * 60 * 24));
            var saat = Math.floor((fark % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
            var saniye = Math.floor((fark % (1000 * 60)) / 1000);

            kutu.querySelector('[data-unit="gun"]').textContent = String(gun).padStart(2, "0");
            kutu.querySelector('[data-unit="saat"]').textContent = String(saat).padStart(2, "0");
            kutu.querySelector('[data-unit="dakika"]').textContent = String(dakika).padStart(2, "0");
            kutu.querySelector('[data-unit="saniye"]').textContent = String(saniye).padStart(2, "0");
        });

        if (fark <= 0) {
            clearInterval(zamanlayici);
        }
    }

    guncelle();
    zamanlayici = setInterval(guncelle, 1000);
})();
</script>
