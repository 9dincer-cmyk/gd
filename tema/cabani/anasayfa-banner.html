<style type="text/css">.yg-banner-by-link-container {

<script>
$(document).ready(function () {

    var ygSlider = $(".yg-banner-by-link-container ul");

    ygSlider.owlCarousel({
        items: 1,
        loop: true,
        autoplay: true,
        autoplayTimeout: 10000,
        autoplayHoverPause: true,
        nav: false,
        dots: true,
        margin: 0
    });

    $(".yg-custom-next").click(function () {
        ygSlider.trigger("next.owl.carousel");
    });

    $(".yg-custom-prev").click(function () {
        ygSlider.trigger("prev.owl.carousel");
    });

});
</script>
