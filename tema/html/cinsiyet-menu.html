<style type="text/css">
/* Şık Menü Stilleri */
.gender-tabs-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.gender-tabs-wrapper::-webkit-scrollbar { display: none; }
.gender-tabs { display: flex; gap: 20px; justify-content: flex-start; align-items: center; flex-wrap: nowrap !important; font-family: "Helvetica Neue", Helvetica, Arial, "Optima", sans-serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; padding-left: 2px; }
.gender-tabs .tab { color: #a0a0a0; cursor: pointer; font-weight: 400; position: relative; transition: all 0.4s ease; padding-bottom: 4px; flex-shrink: 0; }
.gender-tabs .tab a { color: inherit; text-decoration: none; }
.gender-tabs .tab:hover { color: #d8d8d8; }

/* Aktif class (JS ekleyecek) */
.gender-tabs .tab.is-active { color: #ffffff; font-weight: 600; }
.gender-tabs .tab.is-active::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background-color: #ffffff; opacity: 0.8; }

/* Mobil Stilleri */
@media (max-width: 600px) {
  .gender-tabs {
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.5px;
  }
}
</style>
<div class="html custom html_2">
<div class="gender-tabs-wrapper">
<div class="gender-tabs"><span class="tab" id="menu-kadin"><a href="/">KADIN</a></span> <span class="tab" id="menu-erkek"><a href="/erkek-anasayfa">ERKEK</a></span> <span class="tab" id="menu-lostra"><a href="/shoecare">LOSTRA</a></span></div>
</div>
</div>
<script>document.addEventListener("DOMContentLoaded", function() {

    // DİNAMİK MENÜ SEÇİCİ
    var currentPath = window.location.pathname.toLowerCase();
    var currentUrl = window.location.href.toLowerCase();

    var elKadin = document.getElementById("menu-kadin");
    var elErkek = document.getElementById("menu-erkek");
    var elLostra = document.getElementById("menu-lostra");

    if (currentPath.includes("erkek") || currentUrl.includes("erkek") || currentPath.includes("loafer") || currentPath.includes("kategori/erkek")) {
        if(elErkek) elErkek.classList.add("is-active");
    }
    else if (currentPath.includes("shoecare") || currentUrl.includes("shoecare") || currentPath.includes("lostra") || currentPath.includes("bakim")) {
        if(elLostra) elLostra.classList.add("is-active");
    }
    else {
        if(elKadin) elKadin.classList.add("is-active");
    }
});</script>
